name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set lower case owner name
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/wegmarken-backend:${{ github.sha }}, ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/wegmarken-backend:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend-expo
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/wegmarken-frontend:${{ github.sha }}, ${{ env.REGISTRY }}/${{ env.REPO_OWNER }}/wegmarken-frontend:latest

  deploy-and-rollback:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (for docker-compose file)
        uses: actions/checkout@v3

      - name: Copy docker-compose via scp
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/wegmarken"

      - name: Deploy new images
        uses: appleboy/ssh-action@v0.1.10
        id: deploy
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/wegmarken
            echo "IMAGE_TAG=${{ github.sha }}" > .env
            OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            echo "GITHUB_REPOSITORY_OWNER=${OWNER_LC}" >> .env
            # Log in to registry on server
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            
            # Wait for containers to start
            sleep 15
            
            # Health check backend - 
            if ! curl -f http://localhost:5174/api/health; then
              echo "Backend health check failed!"
              exit 1
            fi
            
            # Health check frontend
            if ! curl -f http://localhost:5173; then
              echo "Frontend health check failed!"
              exit 1
            fi

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Deployment failed. Initiating rollback..."
            cd ~/wegmarken
            # In a real scenario, you'd fetch the previous stable SHA.
            # Here we fallback to 'latest' which might still be the old one if we didn't push latest,
            # or we explicitly define PREVIOUS_SHA in a more complex setup.
            # For this simple pipeline, if we fail, we just stop the current containers to prevent a broken state,
            # or revert to a known good tag if managed via a file.
            docker compose -f docker-compose.prod.yml down
            echo "Please manually inspect the server or trigger a rebuild of the previous commit."
