spring.application.name=backend
spring.datasource.url=jdbc:h2:file:./data/wegmarken_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# AWS S3 Configuration
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:wegmarken-images}
aws.s3.region=${AWS_S3_REGION:eu-central-1}
aws.access.key.id=${AWS_ACCESS_KEY_ID:dummy-key}
aws.secret.access.key=${AWS_SECRET_ACCESS_KEY:dummy-secret}

# JWT Secret (persistent across restarts)
jwt.secret=${JWT_SECRET:wegmarken-default-secret-key-change-me-in-production-2026}
spring.h2.console.enabled=true

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Enable CORS for frontend during development
spring.web.cors.allowed-origins=http://localhost:5173

# Subscription Quotas (in MB)
# Backpacker: 500MB, Explorer: 5GB, Globetrotter: 50GB
quota.backpacker=${QUOTA_BACKPACKER:500}
quota.explorer=${QUOTA_EXPLORER:5000}
quota.globetrotter=${QUOTA_GLOBETROTTER:50000}
