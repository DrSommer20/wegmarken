spring.application.name=backend
spring.datasource.url=jdbc:h2:file:./data/wegmarken_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# AWS S3 Configuration
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:wegmarken-images}
aws.s3.region=${AWS_S3_REGION:eu-central-1}
aws.access.key.id=${AWS_ACCESS_KEY_ID:dummy-key}
aws.secret.access.key=${AWS_SECRET_ACCESS_KEY:dummy-secret}
spring.h2.console.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Enable CORS for frontend during development
spring.web.cors.allowed-origins=http://localhost:5173
